<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>13 Frameworks and Preprocessors – practice</title>
  <!-- Bootstrap from a CDN (only to compare – the rest of the course uses plain CSS) -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <style>
    /* Plain CSS with variables and native nesting – things that used to need Sass */
    :root { --accent: #2a7ae2; }
    .plain-card {
      border: 1px solid #d0d7e2; border-radius: 12px; padding: 1rem; max-width: 22rem;
      & h2 { color: var(--accent); font-size: 1.3rem; }
      & button { background: var(--accent); color: white; border: 0; border-radius: 8px; padding: .4rem .9rem; }
    }
  </style>
</head>
<body class="container py-4">
  <h1 class="mb-4">Plain CSS vs a framework</h1>
  <div class="row g-4">
    <div class="col-md-6">
      <div class="plain-card">
        <h2>Plain CSS card</h2>
        <p>Styled with my own CSS using custom properties and native nesting.</p>
        <button type="button">Read more</button>
      </div>
    </div>
    <div class="col-md-6">
      <div class="card" style="max-width: 22rem;">
        <div class="card-body">
          <h2 class="card-title h5 text-primary">Bootstrap card</h2>
          <p class="card-text">Styled only by adding Bootstrap class names – no CSS written by me.</p>
          <button type="button" class="btn btn-primary btn-sm">Read more</button>
        </div>
      </div>
    </div>
  </div>
</body>
</html>

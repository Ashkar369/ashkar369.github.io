<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>02 SVG – practice</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 760px; margin: 2rem auto; padding: 0 1rem; }
    .row { display: flex; gap: 1rem; flex-wrap: wrap; align-items: end; }
    figure { margin: 0; text-align: center; }
    /* Inline SVG can be styled with CSS: */
    .icon:hover circle { fill: tomato; }
  </style>
</head>
<body>
  <h1>SVG practice</h1>

  <h2>1. Basic shapes</h2>
  <svg width="420" height="120" viewBox="0 0 420 120" role="img" aria-label="Basic SVG shapes">
    <rect x="10" y="10" width="90" height="90" rx="12" fill="steelblue" />
    <circle cx="160" cy="55" r="45" fill="gold" stroke="black" stroke-width="3" />
    <line x1="220" y1="100" x2="300" y2="10" stroke="crimson" stroke-width="6" stroke-linecap="round" />
    <polygon points="320,100 360,10 400,100" fill="seagreen" />
  </svg>

  <h2>2. Same SVG, three sizes – always sharp (viewBox does the scaling)</h2>
  <div class="row">
    <figure><svg class="icon" width="40" height="40" viewBox="0 0 100 100"><circle cx="50" cy="50" r="40" fill="orange"/><path d="M30 55 L45 70 L72 35" fill="none" stroke="white" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/></svg><figcaption>40px</figcaption></figure>
    <figure><svg class="icon" width="100" height="100" viewBox="0 0 100 100"><circle cx="50" cy="50" r="40" fill="orange"/><path d="M30 55 L45 70 L72 35" fill="none" stroke="white" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/></svg><figcaption>100px</figcaption></figure>
    <figure><svg class="icon" width="220" height="220" viewBox="0 0 100 100"><circle cx="50" cy="50" r="40" fill="orange"/><path d="M30 55 L45 70 L72 35" fill="none" stroke="white" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/></svg><figcaption>220px (hover me – CSS changes the colour)</figcaption></figure>
  </div>

  <h2>3. SVG with text and a path</h2>
  <svg width="300" height="120" viewBox="0 0 300 120">
    <path d="M10 100 Q 150 -20 290 100" fill="none" stroke="purple" stroke-width="4" />
    <text x="150" y="80" text-anchor="middle" font-size="22" font-family="sans-serif">Hello SVG!</text>
  </svg>

  <h2>4. SVG used as an &lt;img&gt;</h2>
  <img src="https://upload.wikimedia.org/wikipedia/commons/8/84/Example.svg" alt="Example SVG file from Wikimedia Commons" width="120">
</body>
</html>
